<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diktat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon32.png">
<meta name="theme-color" content="#1f4e79">
<style>
  :root {
    --ink: #1c2733; --muted: #5b6b7a; --line: #d6dee6; --paper: #fbfcfd;
    --lake: #1f4e79; --rec: #c5221f; --work: #b06000; --ok: #1e7b45;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 20px 40px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 0 8px; }
  #dot {
    width: 96px; height: 96px; border-radius: 50%; background: var(--line);
    border: none; cursor: pointer; transition: background .2s;
  }
  body[data-state=recording] #dot { background: var(--rec); animation: pulse 1.2s ease-in-out infinite; }
  body[data-state=processing] #dot { background: var(--work); }
  body[data-state=done] #dot { background: var(--ok); }
  @keyframes pulse { 50% { transform: scale(.9); opacity: .75; } }
  @media (prefers-reduced-motion: reduce) { #dot { animation: none !important; } }
  #msg { font-size: 1.15rem; font-weight: 600; text-align: center; }
  #sub { color: var(--muted); font-size: .92rem; text-align: center; margin-top: -8px; }
  #result { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-height: 1em; }
  #result:empty { display: none; }
  details { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { cursor: pointer; color: var(--lake); font-weight: 600; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .95rem; }
  input, textarea, select {
    width: 100%; font: inherit; color: inherit; background: #fff;
    border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px;
  }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  button.btn { font: inherit; font-size: .95rem; cursor: pointer; border-radius: 6px; padding: 8px 14px; border: 1px solid var(--lake); background: var(--lake); color: #fff; }
  button.quiet { background: #fff; color: var(--lake); }
  :focus-visible { outline: 3px solid #7fb0dc; outline-offset: 2px; }
  .status { font-size: .92rem; color: var(--muted); }
  ol { list-style: none; padding: 0; margin: 8px 0 0; }
  li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
  li small { color: var(--muted); display: block; }
  li details { color: var(--muted); font-size: .88rem; margin-top: 4px; }
  li details div { white-space: pre-wrap; }
</style>
</head>
<body data-state="idle">
<main>
  <div class="stage">
    <button id="dot" aria-label="Aufnahme starten oder stoppen"></button>
    <div id="msg">Bereit</div>
    <div id="sub">Leertaste oder Enter: Aufnahme beenden · Esc: abbrechen</div>
  </div>
  <div id="result"></div>

  <details id="setup">
    <summary>Einstellungen und Verlauf</summary>
    <label for="apiKey">Groq-API-Schlüssel</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="gsk_…">
    <label for="model">Erkennungsmodell</label>
    <select id="model">
      <option value="whisper-large-v3">Whisper Large v3 – genauer</option>
      <option value="whisper-large-v3-turbo">Whisper Large v3 Turbo – schneller</option>
    </select>
    <label for="lang">Sprache</label>
    <select id="lang">
      <option value="">Automatisch erkennen</option>
      <option value="de">Immer Deutsch</option>
      <option value="fr">Immer Französisch</option>
      <option value="en">Immer Englisch</option>
    </select>
    <label><input id="cleanup" type="checkbox" style="width:auto"> KI-Bereinigung (Füllwörter, Versprecher, Satzzeichen)</label>
    <label for="llmModel">Sprachmodell für die Bereinigung</label>
    <select id="llmModel">
      <option value="openai/gpt-oss-120b">GPT-OSS 120B – gründlicher</option>
      <option value="openai/gpt-oss-20b">GPT-OSS 20B – schneller</option>
    </select>
    <label for="vocab">Eigene Wörter (durch Kommas getrennt)</label>
    <textarea id="vocab" placeholder="Tegernsee, Rottach-Egern, Claude, Groq"></textarea>
    <label><input id="autoClose" type="checkbox" style="width:auto"> Fenster nach dem Kopieren automatisch schließen</label>
    <div class="row">
      <button id="save" class="btn">Speichern</button>
      <button id="mic" class="btn quiet">Mikrofon freigeben</button>
      <span id="setupStatus" class="status"></span>
    </div>
    <label>Letzte Diktate</label>
    <ol id="history"></ol>
  </details>
</main>
<script src="cleanup.js"></script>
<script src="app.js"></script>
</body>
</html>
